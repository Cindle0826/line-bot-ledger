name: summary

on:
  push:
    branches: [main]
    paths:
      - services/summary/**
      - internal/**
      - deploy/summary/**
      - go.mod
      - go.sum
      - .github/workflows/summary.yml
      - .github/workflows/service-ci.yml
  pull_request:
    paths:
      - services/summary/**
      - internal/**
      - deploy/summary/**
      - go.mod
      - go.sum
      - .github/workflows/summary.yml
      - .github/workflows/service-ci.yml

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: summary
      cloud_run_service: ledger-summary
    secrets: inherit
