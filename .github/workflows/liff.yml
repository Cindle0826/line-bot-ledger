name: liff

on:
  push:
    branches: [main]
    paths:
      - services/liff/**
      - internal/**
      - deploy/liff/**
      - go.mod
      - go.sum
      - .github/workflows/liff.yml
      - .github/workflows/service-ci.yml
  pull_request:
    paths:
      - services/liff/**
      - internal/**
      - deploy/liff/**
      - go.mod
      - go.sum
      - .github/workflows/liff.yml
      - .github/workflows/service-ci.yml

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: liff
      cloud_run_service: ledger-liff
    secrets: inherit
