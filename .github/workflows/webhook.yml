name: webhook

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"] # paths below aren't evaluated for tag pushes — a
    # version tag always runs the full pipeline regardless of what changed
    paths:
      - services/webhook/**
      - internal/**
      - deploy/webhook/**
      - go.mod
      - go.sum
      - .github/workflows/webhook.yml
      - .github/workflows/service-ci.yml
  pull_request:
    paths:
      - services/webhook/**
      - internal/**
      - deploy/webhook/**
      - go.mod
      - go.sum
      - .github/workflows/webhook.yml
      - .github/workflows/service-ci.yml

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: webhook
      cloud_run_service: ledger-webhook
    secrets: inherit
