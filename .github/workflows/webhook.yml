name: webhook

on:
  push:
    branches: [main]
    paths:
      - services/webhook/**
      - internal/**
      - deploy/webhook/**
      - go.mod
      - go.sum
      - .github/workflows/webhook.yml
      - .github/workflows/service-ci.yml
  pull_request:
    paths:
      - services/webhook/**
      - internal/**
      - deploy/webhook/**
      - go.mod
      - go.sum
      - .github/workflows/webhook.yml
      - .github/workflows/service-ci.yml

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: webhook
      cloud_run_service: ledger-webhook
    secrets: inherit
