name: webhook

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"] # paths below aren't evaluated for tag pushes — a
    # version tag always runs the full pipeline regardless of what changed
    paths:
      - services/webhook/**
      - internal/**
      - deploy/webhook/**
      - go.mod
      - go.sum
      - .github/workflows/webhook.yml
      - .github/workflows/service-ci.yml
  # No paths filter here: this is a required status check for merging into
  # main, so it must run on every PR — a docs-only PR would otherwise never
  # trigger it and the "required" check would sit pending forever, blocking
  # the merge with nothing able to satisfy it.
  pull_request: {}

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: webhook
      cloud_run_service: ledger-webhook
    secrets: inherit
